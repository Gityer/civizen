name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_SUPABASE_URL: https://invalid.supabase.local
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-anon-key

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Release lifecycle guard
        if: github.event_name == 'pull_request'
        run: npm run release:guard

      - name: Audit
        run: node scripts/audit-ci.mjs

      - name: Assistant knowledge freshness
        run: npm run assistant:knowledge:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The Playwright specs in e2e/ against a local Supabase built from the migrations and the fixtures in
  # scripts/local-supabase/seed-test-fixtures.sql (fictional people and records; never production data).
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Start local Supabase and replay migrations
        run: scripts/local-supabase/up.sh

      - name: Seed fixtures
        run: docker exec -i supabase_db_civizen-local psql -U postgres -q -v ON_ERROR_STOP=1 < scripts/local-supabase/seed-test-fixtures.sql

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The workflow-level VITE_* placeholders would point the app at an invalid backend; the dev server gets the
      # local stack's URL and anon key instead (the specs refuse to run against anything but localhost).
      - name: Start the web app against the local stack
        run: |
          eval "$(cd ~/civizen-local-supabase && npx -y supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          export VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          nohup npx vite --host 127.0.0.1 --port 8081 --strictPort > vite.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8081/ && exit 0; sleep 1; done
          cat vite.log
          exit 1

      # The functions run with no provider secrets (no AI, SMTP, push or TURN keys): e2e/edge-functions.spec.ts checks
      # that each one boots and keeps its access and input contracts.
      - name: Serve edge functions
        run: |
          cd ~/civizen-local-supabase
          nohup npx -y supabase functions serve > "$GITHUB_WORKSPACE/functions.log" 2>&1 &
          for _ in $(seq 1 90); do grep -q "Serving functions" "$GITHUB_WORKSPACE/functions.log" && break; sleep 2; done
          grep -q "Serving functions" "$GITHUB_WORKSPACE/functions.log" || { cat "$GITHUB_WORKSPACE/functions.log"; exit 1; }
          eval "$(npx -y supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          echo "CIVIZEN_E2E_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "CIVIZEN_E2E_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      # `github` turns each failure into an annotation on the pull request; `list` keeps the readable log.
      - name: E2E
        run: npm run e2e -- --reporter=github,list
        env:
          CIVIZEN_E2E_BASE_URL: http://localhost:8081

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results
          path: |
            test-results/
            vite.log
            functions.log
          retention-days: 7
