name: Migrations replay and SQL tests

# Replays every file in supabase/migrations into an empty local Supabase, so a migration that cannot
# be applied from scratch (e.g. one that needs data the hosted database already had) fails the PR
# instead of the next developer's machine, then runs the SQL tests in supabase/tests (RLS, RPC and
# trigger contracts; each file is BEGIN ... ROLLBACK). Runs when migrations, tests or the tooling change.
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/local-supabase/**'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/local-supabase/**'

permissions:
  contents: read

jobs:
  replay:
    name: replay migrations and run SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start local Supabase and replay migrations
        run: scripts/local-supabase/up.sh

      - name: Run SQL tests
        run: scripts/local-supabase/run-sql-tests.sh
