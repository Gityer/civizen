apply plugin: 'com.android.application'

def releaseConfigFile = file('../../src/lib/app-release.ts')
def releaseConfigText = releaseConfigFile.text
def versionNameMatch = (releaseConfigText =~ /export const APP_VERSION = '([^']+)';/)
def versionCodeMatch = (releaseConfigText =~ /export const ANDROID_VERSION_CODE = (\d+);/)

if (!versionNameMatch.find() || !versionCodeMatch.find()) {
    throw new GradleException("Could not parse app release metadata from ${releaseConfigFile}")
}

def appVersionName = versionNameMatch.group(1)
def appVersionCode = versionCodeMatch.group(1).toInteger()

android {
    namespace = "com.civizen.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.civizen.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing (decision D10): the keystore never lives in the repository.
    //   local:  ~/.civizen-secrets/civizen-release.keystore.properties (storeFile, storePassword, keyAlias, keyPassword)
    //   CI:     ANDROID_KEYSTORE_FILE (path to a decoded keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
    def signingProps = new Properties()
    def signingPropsFile = new File(System.getProperty("user.home"), ".civizen-secrets/civizen-release.keystore.properties")
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }
    def envKeystore = System.getenv("ANDROID_KEYSTORE_FILE")
    def releaseStoreFile = signingProps.getProperty("storeFile") ?: envKeystore
    def releaseStorePassword = signingProps.getProperty("storePassword") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def releaseKeyAlias = signingProps.getProperty("keyAlias") ?: System.getenv("ANDROID_KEY_ALIAS")
    def releaseKeyPassword = signingProps.getProperty("keyPassword") ?: System.getenv("ANDROID_KEY_PASSWORD")
    def hasReleaseSigning = releaseStoreFile != null && new File(releaseStoreFile).exists() && releaseStorePassword != null && releaseKeyAlias != null
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword ?: releaseStorePassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.security:security-crypto:1.0.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
