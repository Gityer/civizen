<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civizen — For a Mature Humanity</title>
    <meta name="description" content="Join a unified, open, decentralized global network built to prevent harm and war, advance world citizenship, and build for a mature humanity." />
    <meta name="author" content="Civizen" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#3bc8c0" />
    <style>
      html { background-color: #fcfdfd; }
      html.dark { background-color: #0c1113; }
    </style>
    <script>
      // Paint the themed background before React mounts so dark-mode users never see a white flash.
      (function () {
        try {
          var stored = window.localStorage.getItem('civizen-theme-v1');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (_error) {
          // Ignore storage / matchMedia failures; ThemeProvider applies the theme after mount.
        }
      })();
    </script>

    <meta property="og:title" content="Civizen — For a Mature Humanity" />
    <meta property="og:description" content="Join a unified, open, decentralized global network built to prevent harm and war, advance world citizenship, and build for a mature humanity." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://civizen.world/" />
    <meta property="og:site_name" content="Civizen" />
    <meta property="og:image" content="https://civizen.world/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Civizen — For a Mature Humanity" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Civizen" />
    <meta name="twitter:title" content="Civizen — For a Mature Humanity" />
    <meta name="twitter:description" content="Join a unified, open, decentralized global network built to prevent harm and war, advance world citizenship, and build for a mature humanity." />
    <meta name="twitter:image" content="https://civizen.world/brand/og-image.png" />
    <script>
      (function () {
        var bootComplete = false;
        var bootFailureReason = 'unknown';
        var BOOT_FAILURE_REPORT_KEY = 'civizen-last-boot-failure';

        function rememberBootFailure(reason) {
          try {
            var payload = {
              reason: reason || 'unknown',
              at: new Date().toISOString(),
              href: window.location.href,
            };
            window.localStorage.setItem(BOOT_FAILURE_REPORT_KEY, JSON.stringify(payload));
          } catch (_error) {
            // Ignore storage failures.
          }
        }

        function getInstallStableLabel() {
          return 'Install stable build';
        }

        function renderFallback(message) {
          var root = document.getElementById('root');
          if (!root) return;
          if (bootComplete) return;
          if (root.dataset.bootFallbackVisible === 'true') return;

          root.dataset.bootFallbackVisible = 'true';
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#050b12;color:#e8f2ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">' +
            '<div style="width:100%;max-width:540px;border:1px solid rgba(88,117,146,.35);border-radius:24px;background:rgba(10,22,34,.92);padding:20px;">' +
            '<h1 style="margin:0 0 8px 0;font-size:24px;line-height:1.2;">Civizen could not start</h1>' +
            '<p style="margin:0 0 14px 0;font-size:14px;line-height:1.5;color:#aac2da;">' + message + '</p>' +
            '<p style="margin:0 0 14px 0;font-size:13px;line-height:1.5;color:#93adc6;">If this is a bad testing build, install the stable production build and reopen the app.</p>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
            '<button id="civizen-boot-reload" type="button" style="height:40px;border:0;border-radius:12px;background:#34d1c6;color:#02151f;font-weight:600;padding:0 16px;cursor:pointer;">Reload app</button>' +
            '<button id="civizen-boot-stable" type="button" style="height:40px;border:1px solid rgba(88,117,146,.5);border-radius:12px;background:transparent;color:#e8f2ff;font-weight:600;padding:0 16px;cursor:pointer;">' + getInstallStableLabel() + '</button>' +
            '</div>' +
            '</div></div>';

          var button = document.getElementById('civizen-boot-reload');
          if (button) {
            button.addEventListener('click', function () {
              var url = new URL(window.location.href);
              url.searchParams.set('boot_reload', Date.now().toString());
              window.location.replace(url.toString());
            });
          }

          var stableButton = document.getElementById('civizen-boot-stable');
          if (stableButton) {
            stableButton.addEventListener('click', function () {
              var fallbackUrl = '/downloads/civizen-debug.apk';
              var withTs = fallbackUrl + '?boot_fallback=' + Date.now();

              fetch('/updates/android-release.json?ts=' + Date.now(), { cache: 'no-store' })
                .then(function (response) {
                  if (!response.ok) return null;
                  return response.json();
                })
                .then(function (manifest) {
                  var url = manifest && typeof manifest.downloadUrl === 'string'
                    ? manifest.downloadUrl
                    : withTs;
                  window.location.assign(url);
                })
                .catch(function () {
                  window.location.assign(withTs);
                });
            });
          }
        }

        var bootWatchdogMs = 60000;
        var bootTimeoutId = window.setTimeout(function () {
          if (!bootComplete) {
            bootFailureReason = 'boot-timeout';
            rememberBootFailure(bootFailureReason);
            renderFallback(
              'The first launch after an update can take up to a minute on slower devices and connections. If this message stays, reload once or reinstall the latest APK from the website.',
            );
          }
        }, bootWatchdogMs);

        window.__CIVIZEN_BOOT_READY__ = function () {
          bootComplete = true;
          window.clearTimeout(bootTimeoutId);
        };

        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            if (event instanceof ErrorEvent && !bootComplete) {
              bootFailureReason = 'runtime-error';
              rememberBootFailure(bootFailureReason);
              renderFallback('The testing build crashed before startup finished.');
              return;
            }
            // Only treat as a failed script *fetch* — runtime ErrorEvents also
            // bubble with target sometimes pointing at the script element, and
            // must not be mistaken for a missing bundle.
            if (
              target &&
              target.tagName === 'SCRIPT' &&
              !(event instanceof ErrorEvent)
            ) {
              bootFailureReason = 'script-load-failure';
              rememberBootFailure(bootFailureReason);
              renderFallback('A required app script did not load.');
            }
          },
          true
        );
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // First paint before the app code arrives (v2 plan step B2): on the landing page, show its hero as static
      // text in the visitor's language. React replaces it on mount; other routes keep the plain themed background.
      (function () {
        try {
          var path = window.location.pathname.replace(/\/+$/, '') || '/';
          if (path !== '/' && path !== '/onboarding') return;
          var root = document.getElementById('root');
          if (!root || root.childNodes.length) return;
          var stored = null;
          try { stored = window.localStorage.getItem('civizen-language'); } catch (_e) {}
          var lang = (stored || navigator.language || 'en').toLowerCase().slice(0, 2);
          var copy = {
            en: ['For a Mature Humanity', 'A voluntary civic network to prevent harm, align interests, and advance world citizenship for a mature humanity — on one shared planet.', 'Join the network', 'Sign in'],
            hy: ['Հասուն մարդկության համար', '', 'Միանալ ցանցին', 'Մուտք'],
            ru: ['Для зрелого человечества', '', 'Присоединиться к сети', 'Войти']
          }[lang] || null;
          if (!copy) copy = ['For a Mature Humanity', 'A voluntary civic network to prevent harm, align interests, and advance world citizenship for a mature humanity — on one shared planet.', 'Join the network', 'Sign in'];
          var dark = document.documentElement.classList.contains('dark');
          var fg = dark ? '#e6eef0' : '#0c1113';
          var muted = dark ? 'rgba(230,238,240,.75)' : 'rgba(12,17,19,.72)';
          root.innerHTML =
            '<div data-static-shell style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:96px 24px 24px;text-align:center;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:' + fg + '">' +
            '<img src="/favicon.svg" alt="" width="56" height="56" style="margin-bottom:20px" />' +
            '<h1 style="margin:0;font-size:44px;line-height:1;font-weight:700;letter-spacing:-.02em">Civizen</h1>' +
            '<p style="margin:12px 0 0;font-size:18px;font-weight:600;color:hsl(38 92% 50%)">' + copy[0] + '</p>' +
            (copy[1] ? '<p style="margin:20px auto 0;max-width:36rem;font-size:16px;line-height:1.6;color:' + muted + '">' + copy[1] + '</p>' : '') +
            '<div style="margin-top:28px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
            '<a href="/signup" style="display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:12px;background:#3bc8c0;color:#04161a;font-weight:600;text-decoration:none">' + copy[2] + '</a>' +
            '<a href="/login" style="display:inline-flex;align-items:center;height:48px;padding:0 20px;border-radius:12px;border:1px solid rgba(59,200,192,.35);color:' + fg + ';font-weight:600;text-decoration:none">' + copy[3] + '</a>' +
            '</div></div>';
        } catch (_error) {
          // the app renders normally
        }
      })();
    </script>
    <noscript>
      <h1>Civizen</h1>
      <p>For a Mature Humanity. A voluntary civic network to prevent harm, align interests, and advance world citizenship
      for a mature humanity, on one shared planet. Civizen needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
